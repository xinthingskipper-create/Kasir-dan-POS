name: Build Android APK (Fahfile)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fahfile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "Menyiapkan environment Android SDK..."
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME"
          fi

          # Pastikan seluruh direktori dan subdirektori SDK dapat ditulis oleh user runner
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" 2>/dev/null || true
          fi

          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true
          if [ ! -w "$ANDROID_HOME" ] || [ ! -w "$ANDROID_HOME/licenses" ]; then
            echo "::warning::$ANDROID_HOME atau subdirektorinya tidak dapat ditulis; beralih ke $HOME/android-sdk"
            FALLBACK_SDK="$HOME/android-sdk"
            mkdir -p "$FALLBACK_SDK/licenses" "$FALLBACK_SDK/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ -z "$(ls -A "$FALLBACK_SDK/cmdline-tools" 2>/dev/null)" ]; then
              cp -r "$ANDROID_HOME/cmdline-tools/." "$FALLBACK_SDK/cmdline-tools/" 2>/dev/null || true
            fi
            ANDROID_HOME="$FALLBACK_SDK"
          fi

          ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          find_sdkmanager() {
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif [ -d "$ANDROID_HOME/cmdline-tools" ]; then
              find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true
            fi
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
          fi

          # Jika sdkmanager tidak ada atau gagal dijalankan dengan JDK 21, unduh cmdline-tools terbaru dari Google
          if [ -z "$SDKMANAGER" ] || ! "$SDKMANAGER" --version --sdk_root="$ANDROID_HOME" >/dev/null 2>&1; then
            echo "Mengunduh Android commandlinetools terbaru..."
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extracted"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -r "$TMP_DIR/extracted/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "Menggunakan sdkmanager: $SDKMANAGER (versi: $("$SDKMANAGER" --version --sdk_root="$ANDROID_HOME" || echo unknown))"

          # Setujui semua lisensi SDK secara non-interaktif
          LIC_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || LIC_STATUS=$?
          set -o pipefail
          if [ "$LIC_STATUS" -ne 0 ]; then
            echo "::error::Gagal memproses lisensi Android SDK (exit code $LIC_STATUS)"
            exit "$LIC_STATUS"
          fi

          # Perbarui cmdline-tools;latest agar metadata paket Android 36.1 dikenali
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "cmdline-tools;latest" || true
          set -o pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          # Pasang platform-tools, build-tools;36.0.0, dan platforms;android-36.1
          INSTALL_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || INSTALL_STATUS=$?
          set -o pipefail
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "::warning::Instalasi langsung platforms;android-36.1 gagal (exit code $INSTALL_STATUS), mencoba paket cadangan..."
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list --channel=0 | grep -E "platforms;android-36|build-tools;36" || true
            set -o pipefail
          fi

          # Setujui ulang lisensi untuk komponen yang baru diunduh
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Android SDK siap di $ANDROID_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env, google-services.json, and Debug Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "Memeriksa file konfigurasi wajib proyek..."

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "File .env dibuat dari .env.example (untuk Secrets Gradle Plugin)"
            else
              touch .env
              echo "File .env kosong dibuat"
            fi
          fi

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "app/google-services.json didekodekan dari secret GOOGLE_SERVICES_JSON_BASE64"
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "app/google-services.json dibuat dari secret GOOGLE_SERVICES_JSON"
          elif [ ! -s "app/google-services.json" ]; then
            echo "::warning::app/google-services.json tidak ada di repositori; membuat konfigurasi fallback agar :app:processDebugGoogleServices berhasil. Tambahkan app/google-services.json atau secret GOOGLE_SERVICES_JSON untuk mengaktifkan layanan Firebase."
            APP_ID=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
            APP_ID="${APP_ID:-com.aistudio.poskasir.wrytxq}"
            cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "offline-pos-placeholder",
              "storage_bucket": "offline-pos-placeholder.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "${APP_ID}"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForOfflineBuildOnly000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "app/google-services.json ditemukan dan siap digunakan"
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
              echo "debug.keystore didekodekan dari debug.keystore.base64"
            fi
          fi

          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            echo "Membuat debug.keystore baru dengan keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            echo "debug.keystore berhasil dibuat dan diverifikasi"
          else
            echo "debug.keystore valid dan siap digunakan"
          fi

      - name: Select Gradle Runner (Wrapper or Installed Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Menggunakan Gradle Wrapper (./gradlew)"
          elif command -v gradle >/dev/null 2>&1 && gradle --version 2>/dev/null | grep -q "Gradle 9\."; then
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Menggunakan Gradle dari setup-gradle: $(which gradle)"
          else
            echo "Gradle 9.3.1 belum aktif di PATH; mengunduh Gradle 9.3.1 resmi..."
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o "/tmp/gradle-9.3.1-bin.zip"
            unzip -q -o "/tmp/gradle-9.3.1-bin.zip" -d "$HOME/.gradle-dist"
            rm -f "/tmp/gradle-9.3.1-bin.zip"
            echo "$HOME/.gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=$HOME/.gradle-dist/gradle-9.3.1/bin/gradle" >> "$GITHUB_ENV"
            echo "Gradle 9.3.1 berhasil dipasang di $HOME/.gradle-dist/gradle-9.3.1/bin/gradle"
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "Memulai proses kompilasi :app:assembleDebug dengan $GRADLE_CMD..."
          echo "ANDROID_HOME=${ANDROID_HOME:-tidak diset} | ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-tidak diset}"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}" ]; then
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          fi
          "$GRADLE_CMD" --version
          "$GRADLE_CMD" :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            -Dorg.gradle.workers.max=2 \
            -Pandroid.builder.sdkDownload=true

      - name: Collect APK Files
        run: |
          echo "Mengumpulkan file APK hasil build..."
          mkdir -p build-apks

          if [ ! -d "app/build/outputs/apk" ]; then
            echo "::error::Direktori app/build/outputs/apk tidak ditemukan setelah build!"
            exit 1
          fi

          while IFS= read -r -d '' apk_file; do
            base_name="$(basename "$apk_file")"
            target_path="build-apks/$base_name"
            if [ -e "$target_path" ]; then
              parent_tag="$(basename "$(dirname "$apk_file")")"
              target_path="build-apks/${parent_tag}-${base_name}"
              counter=2
              while [ -e "$target_path" ]; do
                target_path="build-apks/${parent_tag}-${counter}-${base_name}"
                counter=$((counter + 1))
              done
            fi
            cp -v "$apk_file" "$target_path"
          done < <(find app/build/outputs/apk -type f -name "*.apk" -print0)

          APK_COUNT=$(find build-apks -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada file APK yang ditemukan setelah :app:assembleDebug!"
            exit 1
          fi

          echo "Ditemukan $APK_COUNT file APK:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahfile-debug-apk
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "BUILD GAGAL - DETAIL DIAGNOSTIK"
          echo "=============================================="
          echo "Versi Java:"
          java -version || true
          echo "----------------------------------------------"
          echo "Versi Gradle:"
          if [ -n "${GRADLE_CMD:-}" ]; then
            "$GRADLE_CMD" --version || true
          elif command -v gradle >/dev/null 2>&1; then
            gradle --version || true
          fi
          echo "----------------------------------------------"
          echo "Android SDK Root: ${ANDROID_SDK_ROOT:-tidak diset}"
          if [ -d "${ANDROID_SDK_ROOT:-}/platforms" ]; then
            echo "Platforms:"
            ls -1 "$ANDROID_SDK_ROOT/platforms" || true
          fi
          if [ -d "${ANDROID_SDK_ROOT:-}/build-tools" ]; then
            echo "Build Tools:"
            ls -1 "$ANDROID_SDK_ROOT/build-tools" || true
          fi
          if [ -d "${ANDROID_SDK_ROOT:-}/licenses" ]; then
            echo "Licenses:"
            ls -1 "$ANDROID_SDK_ROOT/licenses" || true
          fi
          echo "----------------------------------------------"
          echo "Struktur Direktori Root (tanpa isi secret):"
          ls -la
          echo "----------------------------------------------"
          echo "Struktur Direktori app/:"
          ls -la app/ || true
          echo "=============================================="
