name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fahfile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "Menyiapkan environment Android SDK..."
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME"
          fi

          # Pastikan runner memiliki izin tulis penuh ke direktori SDK
          if [ ! -w "$ANDROID_HOME" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" || true
          fi

          if [ ! -w "$ANDROID_HOME" ]; then
            echo "::warning::$ANDROID_HOME tidak dapat ditulis; menyiapkan SDK di $HOME/android-sdk"
            FALLBACK_SDK="$HOME/android-sdk"
            mkdir -p "$FALLBACK_SDK"
            if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$FALLBACK_SDK/cmdline-tools" ]; then
              cp -r "$ANDROID_HOME/cmdline-tools" "$FALLBACK_SDK/cmdline-tools" || true
            fi
            ANDROID_HOME="$FALLBACK_SDK"
          fi

          ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Cari sdkmanager dari cmdline-tools (hindari tools/bin/sdkmanager lama yang tidak kompatibel JDK 21)
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di $ANDROID_HOME/cmdline-tools"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          chmod +x "$SDKMANAGER"

          echo "Menggunakan sdkmanager: $SDKMANAGER (versi: $("$SDKMANAGER" --version --sdk_root="$ANDROID_HOME" || echo unknown))"

          # Setujui semua lisensi SDK secara non-interaktif (hindari kegagalan pipefail akibat SIGPIPE dari yes)
          mkdir -p "$ANDROID_HOME/licenses"
          LIC_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || LIC_STATUS=$?
          set -o pipefail
          if [ "$LIC_STATUS" -ne 0 ]; then
            echo "::error::Gagal memproses lisensi Android SDK (exit code $LIC_STATUS)"
            exit "$LIC_STATUS"
          fi

          # Perbarui cmdline-tools;latest agar metadata paket Android 36.1 dikenali
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "cmdline-tools;latest" >/dev/null || true
          set -o pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          # Pasang platform-tools, build-tools;36.0.0, dan platforms;android-36.1
          INSTALL_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || INSTALL_STATUS=$?
          set -o pipefail
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "::warning::Instalasi langsung platforms;android-36.1 gagal, mencoba channel/paket cadangan..."
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list --channel=0 | grep -E "platforms;android-36|build-tools;36" || true
            set -o pipefail
          fi

          # Setujui ulang lisensi untuk komponen yang baru diunduh
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Android SDK siap di $ANDROID_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and Debug Keystore
        run: |
          echo "Memeriksa file konfigurasi wajib proyek..."

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "File .env dibuat dari .env.example (untuk Secrets Gradle Plugin)"
            else
              touch .env
              echo "File .env kosong dibuat"
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore berhasil didekodekan dari debug.keystore.base64"
            else
              echo "Membuat debug.keystore baru dengan keytool..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null
              echo "debug.keystore berhasil dibuat"
            fi
          fi

      - name: Select Gradle Runner (Wrapper or Installed Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Menggunakan Gradle Wrapper (./gradlew)"
          elif command -v gradle >/dev/null 2>&1; then
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "File ./gradlew tidak tersedia di repo; menggunakan Gradle 9.3.1 dari setup-gradle."
          else
            echo "::error::Baik ./gradlew maupun executable gradle tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "Memulai proses kompilasi :app:assembleDebug dengan $GRADLE_CMD..."
          echo "ANDROID_HOME=${ANDROID_HOME:-tidak diset} | ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-tidak diset}"
          "$GRADLE_CMD" :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            -Pandroid.builder.sdkDownload=true

      - name: Collect APK Files
        run: |
          echo "Mengumpulkan file APK hasil build..."
          mkdir -p build-apks

          if [ ! -d "app/build/outputs/apk" ]; then
            echo "::error::Direktori app/build/outputs/apk tidak ditemukan setelah build!"
            exit 1
          fi

          while IFS= read -r -d '' apk_file; do
            base_name="$(basename "$apk_file")"
            target_path="build-apks/$base_name"
            if [ -e "$target_path" ]; then
              parent_tag="$(basename "$(dirname "$apk_file")")"
              target_path="build-apks/${parent_tag}-${base_name}"
              counter=2
              while [ -e "$target_path" ]; do
                target_path="build-apks/${parent_tag}-${counter}-${base_name}"
                counter=$((counter + 1))
              done
            fi
            cp -v "$apk_file" "$target_path"
          done < <(find app/build/outputs/apk -type f -name "*.apk" -print0)

          APK_COUNT=$(find build-apks -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada file APK yang ditemukan setelah :app:assembleDebug!"
            exit 1
          fi

          echo "Ditemukan $APK_COUNT file APK:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahfile-debug-apk
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "BUILD GAGAL - DETAIL DIAGNOSTIK"
          echo "=============================================="
          echo "Versi Java:"
          java -version || true
          echo "----------------------------------------------"
          echo "Versi Gradle:"
          if [ -n "${GRADLE_CMD:-}" ]; then
            "$GRADLE_CMD" --version || true
          elif command -v gradle >/dev/null 2>&1; then
            gradle --version || true
          fi
          echo "----------------------------------------------"
          echo "Android SDK Root: ${ANDROID_SDK_ROOT:-tidak diset}"
          if [ -d "${ANDROID_SDK_ROOT:-}/platforms" ]; then
            echo "Platforms:"
            ls -1 "$ANDROID_SDK_ROOT/platforms" || true
          fi
          if [ -d "${ANDROID_SDK_ROOT:-}/build-tools" ]; then
            echo "Build Tools:"
            ls -1 "$ANDROID_SDK_ROOT/build-tools" || true
          fi
          if [ -d "${ANDROID_SDK_ROOT:-}/licenses" ]; then
            echo "Licenses:"
            ls -1 "$ANDROID_SDK_ROOT/licenses" || true
          fi
          echo "----------------------------------------------"
          echo "Struktur Direktori Root (tanpa isi secret):"
          ls -la
          echo "----------------------------------------------"
          echo "Struktur Direktori app/:"
          ls -la app/ || true
          echo "=============================================="
