name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version and commit SHA
        id: app_meta
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          APP_VERSION="${APP_VERSION:-1.0}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION | Commit: $SHORT_SHA"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "Menyiapkan environment Android SDK..."
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME"
          fi

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" 2>/dev/null || true
          fi

          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true
          if [ ! -w "$ANDROID_HOME" ] || [ ! -w "$ANDROID_HOME/licenses" ]; then
            echo "::warning::$ANDROID_HOME tidak dapat ditulis; beralih ke $HOME/android-sdk"
            FALLBACK_SDK="$HOME/android-sdk"
            mkdir -p "$FALLBACK_SDK/licenses" "$FALLBACK_SDK/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ -z "$(ls -A "$FALLBACK_SDK/cmdline-tools" 2>/dev/null)" ]; then
              cp -r "$ANDROID_HOME/cmdline-tools/." "$FALLBACK_SDK/cmdline-tools/" 2>/dev/null || true
            fi
            ANDROID_HOME="$FALLBACK_SDK"
          fi

          ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          find_sdkmanager() {
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif [ -d "$ANDROID_HOME/cmdline-tools" ]; then
              find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true
            fi
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
          fi

          if [ -z "$SDKMANAGER" ] || ! "$SDKMANAGER" --version --sdk_root="$ANDROID_HOME" >/dev/null 2>&1; then
            echo "Mengunduh Android commandlinetools terbaru..."
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extracted"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -r "$TMP_DIR/extracted/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "Menggunakan sdkmanager: $SDKMANAGER (versi: $("$SDKMANAGER" --version --sdk_root="$ANDROID_HOME" || echo unknown))"

          LIC_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || LIC_STATUS=$?
          set -o pipefail
          if [ "$LIC_STATUS" -ne 0 ]; then
            echo "::error::Gagal memproses lisensi Android SDK (exit code $LIC_STATUS)"
            exit "$LIC_STATUS"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "cmdline-tools;latest" || true
          set -o pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          INSTALL_STATUS=0
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || INSTALL_STATUS=$?
          set -o pipefail
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "::warning::Instalasi platforms;android-36.1 mengembalikan status $INSTALL_STATUS; mencoba fallback platforms;android-36"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            set -o pipefail
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env, google-services.json, and Debug Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "app/google-services.json didekodekan dari secret GOOGLE_SERVICES_JSON_BASE64"
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "app/google-services.json dibuat dari secret GOOGLE_SERVICES_JSON"
          elif [ ! -s "app/google-services.json" ]; then
            echo "::warning::app/google-services.json tidak ada di repositori; membuat konfigurasi fallback agar :app:processDebugGoogleServices berhasil. Tambahkan app/google-services.json atau secret GOOGLE_SERVICES_JSON untuk mengaktifkan layanan Firebase."
            APP_ID=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
            APP_ID="${APP_ID:-com.aistudio.poskasir.wrytxq}"
            cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "offline-pos-placeholder",
              "storage_bucket": "offline-pos-placeholder.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "${APP_ID}"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForOfflineBuildOnly000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi

          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          fi

      - name: Select Gradle Runner
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          elif command -v gradle >/dev/null 2>&1 && gradle --version 2>/dev/null | grep -q "Gradle 9\."; then
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o "/tmp/gradle-9.3.1-bin.zip"
            unzip -q -o "/tmp/gradle-9.3.1-bin.zip" -d "$HOME/.gradle-dist"
            rm -f "/tmp/gradle-9.3.1-bin.zip"
            echo "$HOME/.gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=$HOME/.gradle-dist/gradle-9.3.1/bin/gradle" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}" ]; then
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          fi
          "$GRADLE_CMD" --version
          "$GRADLE_CMD" :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            -Dorg.gradle.workers.max=2 \
            -Pandroid.builder.sdkDownload=true

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-debug-v${{ steps.app_meta.outputs.version }}-${{ steps.app_meta.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=== BUILD DIAGNOSTICS ==="
          java -version || true
          if [ -n "${GRADLE_CMD:-}" ]; then "$GRADLE_CMD" --version || true; fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} | ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -1 "${ANDROID_SDK_ROOT:-/nonexistent}/platforms" 2>/dev/null || true
          ls -1 "${ANDROID_SDK_ROOT:-/nonexistent}/build-tools" 2>/dev/null || true
          ls -1 "${ANDROID_SDK_ROOT:-/nonexistent}/licenses" 2>/dev/null || true
